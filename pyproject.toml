[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "entityml"
version = "0.3.1"
description = "Official Python SDK for the EntityML Market Data API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "EntityML" }
]
dependencies = [
  "requests>=2.31.0",
]
keywords = ["entityml", "polymarket", "kalshi", "sdk", "api"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Development Status :: 4 - Beta",
]

[project.urls]
Homepage = "https://entityml.com"
Documentation = "https://entityml.com/documentation"
Repository = "https://github.com/anaygupta2004/entityml"
Issues = "https://github.com/anaygupta2004/entityml/issues"

[project.scripts]
entityml = "entityml.cli:main"
poly-storage = "entityml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["entityml", "poly_storage_sdk"]
